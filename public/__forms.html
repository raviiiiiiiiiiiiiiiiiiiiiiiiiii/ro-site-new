<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Netlify Form Detection</title>
  </head>
  <body>
    <!-- 
      This static form is detected by Netlify's build crawler to register the form 
      in your Netlify Dashboard under Site configuration > Forms.
    -->
    <form name="ro-booking" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="ro-booking" />
      <input type="hidden" name="bot-field" />
      <input type="text" name="fullName" />
      <input type="tel" name="mobileNumber" />
      <input type="text" name="pinCode" />
      <input type="text" name="selectedBrand" />
      <input type="text" name="serviceType" />
      <input type="text" name="referenceId" />
      <input type="text" name="sourcePage" />
      <input type="text" name="bookedAt" />
    </form>
  </body>
</html>
